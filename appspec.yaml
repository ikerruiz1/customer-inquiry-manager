version: 0.0
Resources:
  - TargetService:
      Type: AWS::ECS::Service
      Properties:
        TaskDefinition: <TASK_DEFINITION>
        LoadBalancerInfo:
          ContainerName: "app"
          ContainerPort: 8000
        CapacityProviderStrategy:
          - CapacityProvider: "FARGATE_SPOT"
            Weight: 1
            Base: 0
